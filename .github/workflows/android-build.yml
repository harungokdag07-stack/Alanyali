
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Extract submitted Android project
        run: |
          mkdir source
          unzip -q project.zip -d source
          if [ "$(find source -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && [ "$(find source -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            mv source/* project
          else
            mv source project
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd project
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
