
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q project.zip -d project
          if [ ! -f project/build.gradle ] && [ ! -f project/build.gradle.kts ]; then
            ROOT=$(find project -name build.gradle -o -name build.gradle.kts | head -n 1)
            if [ -n "$ROOT" ]; then
              ROOT=$(dirname "$ROOT")
              cp -a "$ROOT"/. project/
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK licenses
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses || true
          "$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
