
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q project.zip -d project
          if [ ! -f project/gradlew ]; then
            WRAPPER=$(find project -name gradlew -type f | head -n 1)
            if [ -n "$WRAPPER" ]; then
              ROOT=$(dirname "$WRAPPER")
              cp -a "$ROOT"/. project/
            fi
          fi
          test -f project/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
