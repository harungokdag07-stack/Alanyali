
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q project.zip -d project
          if [ "$(find project -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && [ "$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            mv project/* temp_project
            mv temp_project project
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
